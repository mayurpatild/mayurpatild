# Refreshes the "Recent activity" section of the profile README from public GitHub events
# (pushes, new repos, PRs, issues, releases). Commits only when the list changed.
name: profile activity
on:
  schedule: [{ cron: '20 1 * * *' }]
  workflow_dispatch:
  push: { branches: [master, main] }
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/scripts/activity.mjs
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', GH_USER: mayurpatild, MAX_LINES: 6 }
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "mayurpatild"; git config user.email "mayurpatild@gmail.com"
            git commit -am "chore: update recent activity" && git push
          fi
